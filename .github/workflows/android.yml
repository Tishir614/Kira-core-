name: Android APK
on:
  push:
    branches: ['claude/**']
    paths: ['localai/android/**', 'localai/web/**', '.github/workflows/android.yml']
    tags: ['kira-local-v*']
  workflow_dispatch:
    inputs:
      llama_ref:
        description: 'Ветка/тег llama.cpp для сборки llama-server'
        default: master

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}

      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}

      - name: Link analyzer tests (Node)
        run: node --test localai/tests/analyze.test.js

      - name: Core unit tests (JVM)
        working-directory: localai/android
        run: gradle :core:test --no-daemon

      - name: Build llama-server for Android arm64
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          git clone --depth 1 --branch "${{ github.event.inputs.llama_ref || 'master' }}" https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          ARCH="-march=armv8.2-a+dotprod"
          cmake -S /tmp/llama.cpp -B /tmp/llama-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DCMAKE_C_FLAGS="$ARCH" -DCMAKE_CXX_FLAGS="$ARCH"
          cmake --build /tmp/llama-build --target llama-server -j"$(nproc)"
          mkdir -p localai/android/app/src/main/jniLibs/arm64-v8a
          cp /tmp/llama-build/bin/llama-server localai/android/app/src/main/jniLibs/arm64-v8a/libllama_server.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" localai/android/app/src/main/jniLibs/arm64-v8a/libllama_server.so
          ls -lh localai/android/app/src/main/jniLibs/arm64-v8a

      - name: Build APK
        working-directory: localai/android
        run: gradle :app:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp localai/android/app/build/outputs/apk/release/*.apk out/KiraLocal.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: KiraLocal-apk
          path: out/KiraLocal.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/kira-local-v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/KiraLocal.apk
