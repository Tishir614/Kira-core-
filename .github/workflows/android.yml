name: Android APK
on:
  push:
    branches: ['claude/**']
    paths: ['localai/android/**', 'localai/web/**', 'localai/tests/*.js', '.github/workflows/android.yml']
    tags: ['kira-local-v*']
  workflow_dispatch:
    inputs:
      llama_ref:
        description: 'Ветка/тег llama.cpp для сборки llama-server'
        default: master

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}

      - uses: gradle/actions/setup-gradle@v4
        with: {build-root-directory: localai/android}

      - name: Prepare Android SDK
        run: bash localai/android/scripts/setup_sdk.sh

      - name: Link analyzer tests (Node)
        run: node --test localai/tests/analyze.test.js localai/tests/hub.test.js localai/tests/md.test.js

      - name: Core unit tests (JVM)
        working-directory: localai/android
        run: ./gradlew :core:test --no-daemon

      - uses: actions/cache@v4
        with:
          path: ~/.cache/kira-llama
          key: llama-server-${{ github.event.inputs.llama_ref || 'master' }}-v1

      - name: Build llama-server for Android arm64
        env:
          LLAMA_REF: ${{ github.event.inputs.llama_ref || 'master' }}
        run: bash localai/android/scripts/build_llama.sh

      - name: Build APK
        working-directory: localai/android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp localai/android/app/build/outputs/apk/release/*.apk out/KiraLocal.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: KiraLocal-apk
          path: out/KiraLocal.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/kira-local-v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/KiraLocal.apk
