name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements-dev.lock
      - run: black --check app tests scripts migrations
      - run: ruff check app tests scripts
      - run: mypy app --no-error-summary
      - run: pytest -q
      - run: bandit -q -r app -x tests
      - run: pip-audit -r requirements.lock
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: kira-animator:test}
