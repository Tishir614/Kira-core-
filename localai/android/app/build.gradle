plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.kira.local.app'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.kira.local'
        minSdk 26
        targetSdk 34
        // На Codemagic номер сборки растёт сам — новую версию можно ставить поверх старой.
        versionCode((System.getenv('BUILD_NUMBER') ?: '1') as int)
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    // Если в Codemagic подключён keystore (android_signing), подписываем им; иначе — debug-ключом, чтобы APK можно было сразу установить.
    def cmKeystore = System.getenv('CM_KEYSTORE_PATH')
    signingConfigs {
        if (cmKeystore) {
            release {
                storeFile file(cmKeystore)
                storePassword System.getenv('CM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CM_KEY_ALIAS')
                keyPassword System.getenv('CM_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig cmKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    // Lint для релиза не нужен для APK и заметно замедляет сборку.
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        // llama-server лежит как libllama_server.so и должен быть распакован на диск, чтобы его можно было запустить.
        jniLibs { useLegacyPackaging = true }
    }

    sourceSets {
        main { assets.srcDir layout.buildDirectory.dir('generated/web') }
    }
}

// Интерфейс общий с настольной версией (localai/web) — копируем в assets/web.
def copyWeb = tasks.register('copyWeb', Copy) {
    from('../../web')
    into(layout.buildDirectory.dir('generated/web/web'))
}
// Любая задача сборки (в т.ч. lint) читает assets, поэтому копирование интерфейса выполняется первым.
tasks.configureEach { t -> if (t.name != 'copyWeb') t.dependsOn(copyWeb) }

dependencies {
    implementation project(':core')
}
